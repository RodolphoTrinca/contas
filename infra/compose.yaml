name: contas
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: contas
      POSTGRES_PASSWORD: contas-local
      POSTGRES_DB: contas
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contas -d contas"]
      interval: 2s
      timeout: 3s
      retries: 25
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    entrypoint: ["/bin/bash", "/opt/keycloak/contas-entrypoint.sh"]
    environment:
      ACCOUNTS_PORT: ${ACCOUNTS_PORT:-8080}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/contas_identity
      KC_DB_USERNAME: contas
      KC_DB_PASSWORD: contas-local
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:${ACCOUNTS_PORT:-8080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./themes/banco-krt/login/theme.properties:/opt/keycloak/themes/banco-krt/login/theme.properties:ro
      - ./themes/banco-krt/login/messages:/opt/keycloak/themes/banco-krt/login/messages:ro
      - ./themes/banco-krt/login/resources/css/krt.css:/opt/keycloak/themes/banco-krt/login/resources/css/krt.css:ro
      - ../src/Contas.Web/public/brand:/opt/keycloak/themes/banco-krt/login/resources/brand:ro
      - ./keycloak-entrypoint.sh:/opt/keycloak/contas-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18090}:8080"
  api:
    build:
      context: ..
      dockerfile: src/Contas.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Accounts: Host=postgres;Database=contas;Username=contas;Password=contas-local
      Redis__Connection: redis:6379,abortConnect=false
      Auth__Issuer: http://localhost:${ACCOUNTS_PORT:-8080}/auth/realms/contas
      Auth__RequireHttps: "false"
      Auth__Metadata: http://keycloak:8080/auth/realms/contas/.well-known/openid-configuration
      Seed__Enabled: ${ACCOUNTS_SEED:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_started }
  web:
    build: ../src/Contas.Web
    environment:
      APP_ORIGIN: http://localhost:${ACCOUNTS_PORT:-8080}
      OIDC_ISSUER: http://localhost:${ACCOUNTS_PORT:-8080}/auth/realms/contas
      OIDC_INTERNAL: http://keycloak:8080/auth/realms/contas
      API_INTERNAL: http://api:5080
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${ACCOUNTS_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - keycloak
  api-gateway:
    image: nginx:stable-alpine
    profiles: ["api"]
    ports:
      - "127.0.0.1:${ACCOUNTS_PORT:-8080}:80"
    volumes:
      - ./nginx/api-only.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - keycloak
  fraud-demo:
    build: &demo-build
      context: ..
      dockerfile: samples/Contas.PartnerDemo/Dockerfile
    profiles: ["demos"]
    environment:
      <<: &demo-env
        ASPNETCORE_URLS: http://+:8080
        Partner__TokenEndpoint: http://keycloak:8080/auth/realms/contas/protocol/openid-connect/token
        Partner__AccountsApi: http://api:5080
      Partner__ClientId: fraud-api
      Partner__Secret: fraud-api-local
      Partner__ResourcePath: "/api/v1/fraud/accounts/{id}/status"
    ports:
      - "127.0.0.1:${FRAUD_DEMO_PORT:-5091}:8080"
    depends_on: [api, keycloak]
  cards-demo:
    build: *demo-build
    profiles: ["demos"]
    environment:
      <<: *demo-env
      Partner__ClientId: cards-api
      Partner__Secret: cards-api-local
      Partner__ResourcePath: "/api/v1/cards/accounts/{id}/eligibility"
    ports:
      - "127.0.0.1:${CARDS_DEMO_PORT:-5092}:8080"
    depends_on: [api, keycloak]
volumes:
  postgres-data:
