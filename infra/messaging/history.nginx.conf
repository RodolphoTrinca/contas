server {
    listen 80;
    absolute_redirect off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /fraud/messages {
        set $fraud fraud-demo:8080;
        proxy_pass http://$fraud/api/v1/messages$is_args$args;
    }
    location = /cards/messages {
        set $cards cards-demo:8080;
        proxy_pass http://$cards/api/v1/messages$is_args$args;
    }
    location = / { return 302 /entregas; }
    location ~ ^/(entregas$|_next/|brand/) {
        set $web web:3000;
        proxy_pass http://$web$request_uri;
    }
    location / { return 404; }
}
